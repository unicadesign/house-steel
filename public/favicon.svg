<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0a0a0c"/>
  <!-- four knuckles -->
  <rect x="2" y="2" width="2" height="3" fill="#ffb000"/>
  <rect x="5" y="1" width="2" height="4" fill="#ffb000"/>
  <rect x="8" y="1" width="2" height="4" fill="#ffb000"/>
  <rect x="11" y="2" width="2" height="3" fill="#ffb000"/>
  <!-- finger mass + palm -->
  <rect x="2" y="4" width="11" height="6" fill="#ffb000"/>
  <!-- thumb bump -->
  <rect x="13" y="6" width="2" height="4" fill="#ffb000"/>
  <!-- lower palm -->
  <rect x="3" y="10" width="9" height="2" fill="#ffb000"/>
  <!-- wrist -->
  <rect x="5" y="12" width="6" height="3" fill="#ffb000"/>
</svg>
