; House Steel ATOM-0 — ESP32-S3
; Same JSON protocol as src/lib/protocol/types.ts
[env:atom0]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  madhephaestus/ESP32Servo@^3.0.6
build_flags =
  -DHS_PROTOCOL_VERSION=0
